name: Deploy to AWS ECS ($0)

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: docvault-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/docvault-backend:latest ./backend
          docker push $ECR_REGISTRY/docvault-backend:latest
          
          docker build -t $ECR_REGISTRY/docvault-worker:latest ./backend
          docker push $ECR_REGISTRY/docvault-worker:latest
          
          docker build -f ./frontend/Dockerfile.prod -t $ECR_REGISTRY/docvault-frontend:latest ./frontend
          docker push $ECR_REGISTRY/docvault-frontend:latest
          
          docker pull redis:7-alpine
          docker tag redis:7-alpine $ECR_REGISTRY/docvault-redis:latest
          docker push $ECR_REGISTRY/docvault-redis:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service docvault-redis --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service docvault-backend --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service docvault-worker --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service docvault-frontend --force-new-deployment