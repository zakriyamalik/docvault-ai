name: DocVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Free up disk space (to prevent "no space left" errors)
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes
          echo "=== After cleanup ==="
          df -h

      # 3️⃣ Create .env with deterministic stub settings
      - name: Create .env file
        run: |
          mkdir -p backend
          echo "LLM_PROVIDER=stub" > backend/.env
          echo "EMBEDDING_STUB=true" >> backend/.env
          echo "EVAL_SEED=1337" >> backend/.env

      # 4️⃣ Set up Docker buildx
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # 5️⃣ Build containers
      - name: Build containers
        run: |
          cd infra
          docker compose build

      # 6️⃣ Start only required containers
      - name: Start containers
        run: |
          cd infra
          docker compose up -d backend redis worker

      # 7️⃣ Wait for backend health
      - name: Wait for backend
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:8000/health; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy"
          exit 1

      # 8️⃣ Run Chat API tests
      - name: Run Chat API tests
        env:
          LLM_PROVIDER: stub
          EMBEDDING_STUB: "true"
          EVAL_SEED: "1337"
        run: |
          cd infra
          docker compose exec -e LLM_PROVIDER=stub -e EMBEDDING_STUB=true -e EVAL_SEED=1337 backend \
            pytest app/tests/test_chat_api.py -v --tb=short

      # 9️⃣ Run Admin API tests
      - name: Run Admin API tests
        env:
          LLM_PROVIDER: stub
          EMBEDDING_STUB: "true"
          EVAL_SEED: "1337"
        run: |
          cd infra
          docker compose exec -e LLM_PROVIDER=stub -e EMBEDDING_STUB=true -e EVAL_SEED=1337 backend \
            pytest app/tests/test_admin_api.py -v --tb=short

      # 🔟 Run RAG E2E tests
      - name: Run RAG Pipeline E2E tests
        env:
          LLM_PROVIDER: stub
          EMBEDDING_STUB: "true"
          EVAL_SEED: "1337"
        run: |
          cd infra
          docker compose exec -e LLM_PROVIDER=stub -e EMBEDDING_STUB=true -e EVAL_SEED=1337 backend \
            pytest app/tests/test_rag_pipeline_e2e.py -v --tb=short

      # 11️⃣ Collect docker logs (always)
      - name: Collect docker logs
        if: always()
        run: |
          cd infra
          docker compose logs > docker-compose.log

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: infra/docker-compose.log

      # 12️⃣ Stop containers
      - name: Stop containers
        run: |
          cd infra
          docker compose down