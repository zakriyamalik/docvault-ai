services:
  # -----------------------
  # Backend (FastAPI)
  # -----------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docvault_backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - uploads-data:/data/uploads
      - ./data/uploads:/data/uploads
      - db-data:/data/db
      - faiss-data:/data/faiss
      - model-cache:/root/.cache
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-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}
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.1-8b-instant
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/sentence-transformers
    command: sh -c "python /app/app/db/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 5
    depends_on:
      redis:
        condition: service_started

  # -----------------------
  # Worker (Background job consumer)
  # -----------------------
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docvault_worker
    command: python -m app.worker.worker
    volumes:
      - uploads-data:/data/uploads
      - ./data/uploads:/data/uploads    # <-- RESTORED
      - db-data:/data/db
      - faiss-data:/data/faiss
      - model-cache:/root/.cache
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-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}
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.1-8b-instant
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/sentence-transformers
      - TRANSFORMERS_CACHE=/root/.cache/huggingface  # <-- RESTORED
      - HF_HOME=/root/.cache/huggingface              # <-- RESTORED
    depends_on:
      - redis
      - backend
    deploy:                              # <-- RESTORED
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped             # <-- RESTORED

  # -----------------------
  # Redis (Queue broker)
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: docvault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # -----------------------
  # Frontend 
  # -----------------------
  frontend:                             # <-- RESTORED ENTIRE SERVICE
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: docvault_frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: "http://localhost:8000"
    volumes:
      - ../frontend:/app
      - node_modules_frontend:/app/node_modules

# -----------------------
# Volumes
# -----------------------
volumes:
  redis-data:
  uploads-data:
  db-data:
  faiss-data:
  node_modules_frontend:
  model-cache: